<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Espacio · Sucesos Mágicos</title>
<meta name="description" content="Tu espacio personal con todo tu material de Sucesos Mágicos.">
<meta name="theme-color" content="#8408a8">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mi Espacio">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eae2ec;color:#5a1470;-webkit-tap-highlight-color:transparent}
  .w{max-width:560px;margin:0 auto;padding:22px 14px 48px}
  header{text-align:center;padding:12px 0 18px}
  header h1{margin:0;color:#8408a8;font-size:28px;letter-spacing:.2px}
  header p{margin:6px 0 0;color:#7a5a86;font-size:14px}
  .card{background:#fff;border-radius:18px;padding:20px 18px;margin:0 0 16px;box-shadow:0 2px 12px rgba(132,8,168,.08)}
  .card h2{margin:0 0 6px;color:#ff3fae;font-size:20px;line-height:1.25}
  .sub{margin:0 0 14px;color:#7a5a86;font-size:14px;line-height:1.45}
  .btn{display:block;width:100%;text-align:center;background:#8408a8;color:#fff;text-decoration:none;padding:13px 16px;border:0;border-radius:30px;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer;font-family:inherit}
  .btn.sec{background:#f3e6f7;color:#8408a8}
  .bar{height:10px;background:#f3e6f7;border-radius:10px;overflow:hidden;margin:6px 0 10px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff66c4,#8408a8);width:0;transition:width .3s}
  .dia{border:1px solid #efdff4;border-radius:14px;margin:8px 0;overflow:hidden}
  .dia summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;font-weight:bold}
  .dia summary::-webkit-details-marker{display:none}
  .dia[open] summary{background:#fbf3fd}
  .ok{width:22px;height:22px;border-radius:50%;border:2px solid #d9b8e6;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .dia.hecho .ok{background:#8408a8;border-color:#8408a8}
  .dia .in{padding:4px 14px 14px}
  .marca{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:#7a5a86}
  .marca input{width:22px;height:22px;accent-color:#8408a8}
  .nota{font-size:13px;color:#7a5a86;text-align:center;margin-top:18px;line-height:1.55}
  .nota a{color:#8408a8}
  input[type=email]{width:100%;padding:13px;border-radius:12px;border:1px solid #d9b8e6;font-size:16px;margin:10px 0;font-family:inherit}
  .carga{text-align:center;padding:40px 0;color:#7a5a86}
  .spin{width:34px;height:34px;border:3px solid #e4cdee;border-top-color:#8408a8;border-radius:50%;margin:0 auto 12px;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .inst{display:none}
</style>
</head>
<body>
<div class="w">
  <header><h1>Mi Espacio ✨</h1><p>Sucesos Mágicos · Dra. Pamela Pasquali</p></header>
  <main id="app"><div class="carga"><div class="spin"></div>Cargando tu material…</div></main>
</div>
<script>
var API = 'https://script.google.com/macros/s/AKfycby10w4nMvAdWs-Cf4fdZUlk5myx070n-fnj6p6igvDEvgT3AbRcweLH3xnpGQls7kuj/exec';
var WA = '5491143995885';
var ICON = { video: '🎬', imagen: '🌸', audio: '🎧', doc: '📖' };
var app = document.getElementById('app');

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lindo(s){ return String(s).replace(/\.[a-z0-9]{2,4}$/i,'').replace(/^\d+\s*[-–.]\s*/,'').replace(/^00\s*/,'').replace(/D[ií]a\s*0?(\d+)/i,'Día $1').trim(); }
function esDia(s){ return /d[ií]a/i.test(s); }
function api(q){ return fetch(API + '?' + q, { redirect: 'follow' }).then(function(r){ return r.json(); }); }
function guardar(k){ try { localStorage.setItem('me_k', k); } catch(e){} }
function leer(){ try { return localStorage.getItem('me_k'); } catch(e){ return null; } }

var params = new URLSearchParams(location.search);
var K = params.get('k') || leer();
if (params.get('k')) guardar(params.get('k'));

function botones(archivos){
  return archivos.map(function(a){
    return '<a class="btn sec" target="_blank" rel="noopener" href="' + esc(a.u) + '">' + (ICON[a.t] || '📄') + ' ' + esc(lindo(a.n)) + '</a>';
  }).join('');
}

function render(d){
  if (!d.productos.length){
    app.innerHTML = '<div class="card"><h2>Todavía no hay material</h2><p class="sub">No encontramos compras activas para ' + esc(d.email) +
      '. Si ya pagaste, en unos minutos aparece.</p><a class="btn" href="https://wa.me/' + WA + '" target="_blank">Escribir por WhatsApp</a></div>';
    return;
  }
  var h = '';
  d.productos.forEach(function(p){
    h += '<div class="card"><h2>' + esc(p.nombre) + '</h2>' + (p.bienvenida ? '<p class="sub">' + esc(p.bienvenida) + '</p>' : '');
    if (p.secciones.length){
      var total = p.secciones.filter(function(s){ return esDia(s.n); }).length || p.secciones.length;
      var hechos = p.hechos || [];
      var abrir = 0;
      if (hechos.length){ abrir = -1; p.secciones.forEach(function(s, i){ if (abrir < 0 && esDia(s.n) && hechos.indexOf(s.n) < 0) abrir = i; }); }
      h += '<div class="sub" style="margin:0"><b id="cnt_' + p.id + '">0</b> de ' + total + ' días hechos</div>' +
        '<div class="bar"><i id="bar_' + p.id + '" data-total="' + total + '"></i></div>';
      p.secciones.forEach(function(s, i){
        var hecho = hechos.indexOf(s.n) >= 0;
        h += '<details class="dia' + (hecho ? ' hecho' : '') + '"' + (i === abrir ? ' open' : '') + '><summary><span class="ok">' + (hecho ? '✓' : '') +
          '</span>' + esc(lindo(s.n)) + '</summary><div class="in">' + botones(s.archivos) +
          (esDia(s.n) ? '<label class="marca"><input type="checkbox" data-p="' + esc(p.id) + '" data-s="' + esc(s.n) + '"' + (hecho ? ' checked' : '') + '> Ya lo hice</label>' : '') +
          '</div></details>';
      });
      h += botones(p.archivos);
    } else {
      h += botones(p.archivos) || '<a class="btn" target="_blank" rel="noopener" href="' + esc(p.carpeta) + '">Abrir ' + esc(p.nombre) + '</a>';
    }
    h += '</div>';
  });
  h += '<p class="nota">Tu material se abre con tu cuenta de Google <b>' + esc(d.email) + '</b>.<br>' +
    '📲 <b>Tip:</b> en el menú del navegador elegí <b>"Agregar a pantalla de inicio"</b> y entrás con un toque, como una app.<br>' +
    '¿Dudas? <a href="https://wa.me/' + WA + '" target="_blank">Escribinos por WhatsApp</a></p>';
  app.innerHTML = h;
  document.querySelectorAll('[id^=bar_]').forEach(function(b){ actualizar(b.id.slice(4)); });
  document.querySelectorAll('input[data-p]').forEach(function(c){
    c.addEventListener('change', function(){
      var det = c.closest('details');
      det.classList.toggle('hecho', c.checked);
      det.querySelector('.ok').textContent = c.checked ? '✓' : '';
      actualizar(c.dataset.p);
      api('api=marcar&k=' + encodeURIComponent(K) + '&p=' + encodeURIComponent(c.dataset.p) + '&s=' + encodeURIComponent(c.dataset.s) + '&h=' + (c.checked ? 1 : 0)).catch(function(){});
    });
  });
}

function actualizar(p){
  var b = document.getElementById('bar_' + p); if (!b) return;
  var n = document.querySelectorAll('input[data-p="' + p + '"]:checked').length;
  b.style.width = Math.round(100 * n / Number(b.dataset.total)) + '%';
  document.getElementById('cnt_' + p).textContent = n;
}

function recuperar(aviso){
  app.innerHTML = '<div class="card"><h2>Entrá a tu material</h2><p class="sub">' + esc(aviso || 'Escribí el mail con el que compraste y te mandamos tu link personal a Mi Espacio.') + '</p>' +
    '<form id="f"><input type="email" id="m" placeholder="tu@mail.com" autocomplete="email" required>' +
    '<button class="btn" type="submit">Enviarme mi link</button></form><p class="sub" id="r" style="margin-top:12px"></p></div>' +
    '<p class="nota">¿Usás Gmail? También podés ver todo tu material en <a href="https://drive.google.com/drive/shared-with-me" target="_blank">Drive → Compartidos conmigo</a>.</p>';
  document.getElementById('f').onsubmit = function(e){
    e.preventDefault();
    var r = document.getElementById('r'); r.textContent = 'Enviando…';
    api('api=recuperar&m=' + encodeURIComponent(document.getElementById('m').value))
      .then(function(d){ r.textContent = d.msg || 'Listo, revisá tu mail.'; })
      .catch(function(){ r.textContent = 'No pudimos enviarlo. Probá de nuevo o escribinos por WhatsApp.'; });
  };
}

if (!K) recuperar();
else api('api=espacio&k=' + encodeURIComponent(K)).then(function(d){
  if (d.ok) render(d);
  else { try { localStorage.removeItem('me_k'); } catch(e){} recuperar('Este link no es válido o es viejo. Pedí uno nuevo con tu mail:'); }
}).catch(function(){
  app.innerHTML = '<div class="card"><h2>No pudimos cargar tu material</h2><p class="sub">Revisá tu conexión y volvé a intentar.</p>' +
    '<button class="btn" onclick="location.reload()">Reintentar</button></div>';
});
</script>
</body>
</html>
